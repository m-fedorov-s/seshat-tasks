name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"   # GO_VERSION in docker/Dockerfile.server and docker/Dockerfile.bot
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29   # v2.2.1
        with:
          version: 0.16.0
      - run: make server-test
      - run: make schema-test
      - run: make bot-test
      - run: cd client/zig && zig build && zig build test
      - run: make client-integration-test
