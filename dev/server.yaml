# Dev server config (throwaway admin token — local use only).
# Start it with dev/run-server.sh (or `make dev-server`), which unsets SESHAT_* first.
admin_token: devadmin-devadmin-devadmin-devadmin
bind: 127.0.0.1
port: 8799
data_file: dev/seshat-dev.db
rate_limit: 100     # the dev dataset is 19 adds; the default 10 r/s (burst 20) leaves one request to spare
